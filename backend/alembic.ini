# Alembic config. Run from anywhere with: alembic -c backend/alembic.ini <cmd>
# (script_location/prepend_sys_path use %(here)s = this file's directory, so CWD
# doesn't matter). The DB URL is resolved in env.py, NOT here — leave it blank.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
